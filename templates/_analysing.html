{# animated "analysing" mark: dashcam frame, the tracked car in a red box, a scan line and the road - shown while the engine runs #}
<svg class="va-loader" viewBox="270 150 990 760" aria-hidden="true">
  <style>
    .sl-corner{fill:none;stroke:#066b44;stroke-width:36;stroke-linecap:round}
    .sl-red{fill:none;stroke:#d9342b;stroke-width:16;stroke-linecap:round}
    .sl-dark{fill:#143c2b}
    .sl-glass{fill:#7fbb9b}
    .sl-lamp{fill:#d4e8dc}
    .sl-light{fill:none;stroke:#7fbb9b;stroke-linecap:round}
    .sl-road{stroke-width:26;stroke-dasharray:52 40;animation:sl-road .7s linear infinite}
    .sl-scan{stroke-width:14;animation:sl-scan 2s ease-in-out infinite}
    .sl-spark{stroke-width:16;transform-box:fill-box;transform-origin:center;animation:sl-spark 1.6s ease-in-out infinite}
    .sl-lock{transform-box:fill-box;transform-origin:center;animation:sl-lock 1.6s ease-in-out infinite}
    .sl-car{animation:sl-car 3s ease-in-out infinite}
    @keyframes sl-road{to{stroke-dashoffset:-92}}
    @keyframes sl-scan{0%,100%{transform:translateY(-150px)}50%{transform:translateY(120px)}}
    @keyframes sl-spark{0%,100%{opacity:.25;transform:scale(.6) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
    @keyframes sl-lock{0%,100%{transform:scale(1.06)}50%{transform:scale(.97)}}
    @keyframes sl-car{0%,100%{transform:translateX(-10px)}50%{transform:translateX(10px)}}
    @media (prefers-reduced-motion:reduce){.sl-road,.sl-scan,.sl-spark,.sl-lock,.sl-car{animation:none}}
  </style>
