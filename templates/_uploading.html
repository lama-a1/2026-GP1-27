{# animated "uploading" mark: dashcam frame, the video clip rising toward the cloud, a data stream and the road - shown while the video uploads #}
<svg class="va-loader" viewBox="0 0 400 300" aria-hidden="true">
  <style>
    .su-corner{fill:none;stroke:#066b44;stroke-width:14;stroke-linecap:round}
    .su-cloud{fill:#d4e8dc;stroke:#066b44;stroke-width:8;stroke-linejoin:round}
    .su-arrow{fill:none;stroke:#066b44;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
    .su-dark{fill:#143c2b}
    .su-glass{fill:#7fbb9b}
    .su-light{fill:none;stroke:#7fbb9b;stroke-linecap:round}
    .su-stream{stroke-width:8;stroke-dasharray:10 12;animation:su-stream .6s linear infinite}
    .su-road{stroke-width:10;stroke-dasharray:20 16;animation:su-road .7s linear infinite}
    .su-clip{animation:su-clip 2.2s ease-in-out infinite}
    .su-arrow-g{animation:su-arrow 1.4s ease-in-out infinite}
    @keyframes su-stream{to{stroke-dashoffset:22}}
    @keyframes su-road{to{stroke-dashoffset:-36}}
    @keyframes su-clip{0%,100%{transform:translateY(6px)}50%{transform:translateY(-8px)}}
    @keyframes su-arrow{0%,100%{transform:translateY(4px);opacity:.55}50%{transform:translateY(-4px);opacity:1}}
    @media (prefers-reduced-motion:reduce){.su-stream,.su-road,.su-clip,.su-arrow-g{animation:none}}
  </style>
